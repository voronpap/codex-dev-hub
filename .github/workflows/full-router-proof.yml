name: Pinned router candidate (no model)
on:
  # Push diff filters are per-push. PR path filters use the whole PR diff and
  # rerun expensive builds on later docs-only commits in the same PR.
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/router_fix_test.rs'
      - 'scripts/build_full_router_proof.py'
      - 'scripts/derive_router_build_lock.py'
      - 'docs/evidence/stage3g-full-router/metadata.json'
      - '.github/workflows/full-router-proof.yml'
  workflow_dispatch:
concurrency:
  group: pinned-router-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pinned-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned upstream Linux build prerequisites
        # Exact source .github/workflows/rust-ci-full-nextest-platform.yml:79-85.
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - name: Build and test actual pinned router
        run: python scripts/build_full_router_proof.py --workspace "$RUNNER_TEMP/router-source" --output "$RUNNER_TEMP/router-proof/result.json" --derived-test-build-lock --candidate-fix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-pinned-router-proof
          path: ${{ runner.temp }}/router-proof
          if-no-files-found: error
