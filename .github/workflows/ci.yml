name: Offline core
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      windows_full: ${{ steps.scope.outputs.windows_full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --diff scripts/build_production_router_proof.py tests/test_approved_call_candidate.py
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/probe_oci_boundary.py
      - run: uv run --locked devhub validate-config --config config/offline.toml
      - run: uv run --locked python scripts/check_evidence.py
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'windows-full') }}
        run: python scripts/windows_scope.py
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m windows_smoke
  windows-full:
    needs: linux
    if: needs.linux.outputs.windows_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked
      - run: uv run --locked pytest -q
