name: Native Linux directory bundle V10

on:
  workflow_dispatch:
    inputs:
      native_build_run_id:
        description: Exact retained successful linux-build-012 workflow run ID
        required: true
        type: string
      native_build_run_attempt:
        description: Exact successful linux-build-012 workflow run attempt
        required: true
        type: string

concurrency:
  group: native-linux-bundle-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  linux-bundle:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install exact bundle tooling
        run: |
          python -m pip install pip==26.2.1 uv==0.12.10
          uv sync --locked
          python -I -m pip --version
          uv --version
      - name: Focused Linux bundle regressions
        run: >-
          uv run --locked pytest -q
          tests/test_linux_native_bundle.py
          tests/test_linux_native_codex.py
          tests/test_native_bundle.py
          tests/test_native_build_artifact_inventory.py
      - name: Download and verify retained Linux Build-012
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODEX_COMMIT: c272ed6169a718204f2830a4aa34a5548a650652
          BUILD_RUN_ID: ${{ inputs.native_build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.native_build_run_attempt }}
        run: |
          gh run view "$BUILD_RUN_ID" --repo '${{ github.repository }}' \
            --json headSha,attempt,conclusion,event > "$RUNNER_TEMP/linux-build-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID" \
            > "$RUNNER_TEMP/linux-build-run-api.json"
          test "$BUILD_RUN_ID" = "38354927618"
          test "$BUILD_RUN_ATTEMPT" = "1"
          jq -e --arg head "$EXPECTED_CODEX_COMMIT" --argjson attempt "$BUILD_RUN_ATTEMPT" \
            '.headSha == $head and .attempt == $attempt and .conclusion == "success" and .event == "workflow_dispatch"' \
            "$RUNNER_TEMP/linux-build-run.json"
          jq -e '.path == ".github/workflows/linux-native-codex.yml"' \
            "$RUNNER_TEMP/linux-build-run-api.json"
          gh run download "$BUILD_RUN_ID" --repo '${{ github.repository }}' \
            --name devfabric-linux-build-012-binaries \
            --dir "$RUNNER_TEMP/linux-build-012"
      - name: Build and relocate exact native Linux Bundle V10
        run: |
          uv run --locked --group linux-bundle-build python scripts/build_linux_native_bundle.py \
            --output "$RUNNER_TEMP/devfabric-linux-native" \
            --expected-commit '${{ github.sha }}' \
            --codex-artifact "$RUNNER_TEMP/linux-build-012" \
            --expected-codex-commit 'c272ed6169a718204f2830a4aa34a5548a650652' \
            --accepted-run-id '${{ inputs.native_build_run_id }}' \
            --accepted-run-attempt '${{ inputs.native_build_run_attempt }}'
          uv run --locked python scripts/verify_linux_native_bundle.py \
            --release "$RUNNER_TEMP/devfabric-linux-native" \
            --destination "$RUNNER_TEMP/devfabric-linux-native-verified"
      - name: Upload exact native Linux Bundle V10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devfabric-linux-native-bundle
          path: ${{ runner.temp }}/devfabric-linux-native/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
