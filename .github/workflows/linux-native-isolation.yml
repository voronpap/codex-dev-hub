name: Native Linux isolation mechanics

on:
  workflow_dispatch:
    inputs:
      native_bundle_run_id:
        description: Exact successful Linux Bundle V11 workflow run ID
        required: true
        type: string
      native_bundle_run_attempt:
        description: Exact successful Linux Bundle V11 workflow run attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  linux-isolation-mechanics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install exact locked tooling
        run: |
          python -m pip install pip==26.2.1 uv==0.12.10
          uv sync --locked
      - name: Focused Linux isolation contracts
        run: >-
          uv run --locked pytest -q
          tests/test_linux_native_isolation.py
          tests/test_ollama_transport.py
          tests/test_linux_native_bundle.py
      - name: Download and verify exact-main Linux Bundle V11
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_COMMIT: 5d3942f103180dd3834a4c2096ded9149b13da64
          BUNDLE_RUN_ID: ${{ inputs.native_bundle_run_id }}
          BUNDLE_RUN_ATTEMPT: ${{ inputs.native_bundle_run_attempt }}
        run: |
          test "$BUNDLE_RUN_ID" = "38426368741"
          test "$BUNDLE_RUN_ATTEMPT" = "1"
          gh run view "$BUNDLE_RUN_ID" --repo '${{ github.repository }}' \
            --json headSha,attempt,conclusion,event > "$RUNNER_TEMP/linux-bundle-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/$BUNDLE_RUN_ID" \
            > "$RUNNER_TEMP/linux-bundle-run-api.json"
          jq -e --arg head "$EXPECTED_BUNDLE_COMMIT" --argjson attempt "$BUNDLE_RUN_ATTEMPT" \
            '.headSha == $head and .attempt == $attempt and .conclusion == "success" and .event == "workflow_dispatch"' \
            "$RUNNER_TEMP/linux-bundle-run.json"
          jq -e '.path == ".github/workflows/linux-native-bundle.yml"' \
            "$RUNNER_TEMP/linux-bundle-run-api.json"
          gh run download "$BUNDLE_RUN_ID" --repo '${{ github.repository }}' \
            --name devfabric-linux-native-bundle \
            --dir "$RUNNER_TEMP/linux-native-release"
          uv run --locked python scripts/verify_linux_native_bundle.py \
            --release "$RUNNER_TEMP/linux-native-release" \
            --destination "$RUNNER_TEMP/linux-native-release-verified"
      - name: Bind exact clean main authority
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/linux-native-isolation"
          python -c 'import secrets; print(secrets.token_hex(16))' \
            > "$RUNNER_TEMP/linux-native-isolation/environment-id"
      - name: Install exact private unshare AppArmor authority
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
            scripts/manage_linux_native_isolation_apparmor.py setup \
            --repo "$GITHUB_WORKSPACE" \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --environment-instance-id "$environment_id" \
            --state-output "$RUNNER_TEMP/linux-native-isolation/apparmor-state.json" \
            --failure-output "$RUNNER_TEMP/linux-native-isolation/lifecycle-failure.json"
      - name: Prepare exact transient cgroup and syscall authority
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
            scripts/manage_linux_native_cgroup.py setup-v19 \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --environment-instance-id "$environment_id" \
            --service-uid "$(id -u)" \
            --service-gid "$(id -g)" \
            --output "$RUNNER_TEMP/linux-native-isolation/cgroup-state.json" \
            --failure-output "$RUNNER_TEMP/linux-native-isolation/cgroup-failure.json"
      - name: Prove matched no-filter control and exact cleanup
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
            scripts/manage_linux_native_cgroup.py control-v19 \
            --state "$RUNNER_TEMP/linux-native-isolation/cgroup-state.json" \
            --repo "$GITHUB_WORKSPACE" \
            --observation "$RUNNER_TEMP/linux-native-isolation/control-observation.json" \
            --execution-authority "$RUNNER_TEMP/linux-native-isolation/control-execution.json" \
            --unit-journal "$RUNNER_TEMP/linux-native-isolation/control-unit-journal.json" \
            --output "$RUNNER_TEMP/linux-native-isolation/control-receipt.json" \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --environment-instance-id "$environment_id" \
            --failure-output "$RUNNER_TEMP/linux-native-isolation/cgroup-failure.json"
      - name: Real rootless namespace and broker mechanics inside exact cgroup
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
            scripts/manage_linux_native_cgroup.py run-v19 \
            --state "$RUNNER_TEMP/linux-native-isolation/cgroup-state.json" \
            --repo "$GITHUB_WORKSPACE" \
            --policy-output "$RUNNER_TEMP/linux-native-isolation/systemd-policy.json" \
            --unit-journal "$RUNNER_TEMP/linux-native-isolation/target-unit-journal.json" \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --environment-instance-id "$environment_id" \
            --failure-output "$RUNNER_TEMP/linux-native-isolation/cgroup-failure.json" \
            -- \
            "$GITHUB_WORKSPACE/.venv/bin/python" scripts/probe_linux_native_isolation.py \
              --implementation-commit "$IMPLEMENTATION_COMMIT" \
              --environment-instance-id "$environment_id" \
              --output "$RUNNER_TEMP/linux-native-isolation/mechanics.json" \
              --failure-output "$RUNNER_TEMP/linux-native-isolation/failure.json" \
              --release "$RUNNER_TEMP/linux-native-release" \
              --bundle-root "$RUNNER_TEMP/linux-native-release-verified/bundle" \
              --bundle-run-id '${{ inputs.native_bundle_run_id }}' \
              --bundle-run-attempt '${{ inputs.native_bundle_run_attempt }}' \
              --cgroup-state "$RUNNER_TEMP/linux-native-isolation/cgroup-state.json" \
              --control-receipt "$RUNNER_TEMP/linux-native-isolation/control-receipt.json"
      - name: Remove exact transient cgroup and seal cleanup
        if: always()
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          state="$RUNNER_TEMP/linux-native-isolation/cgroup-state.json"
          mechanics="$RUNNER_TEMP/linux-native-isolation/mechanics.json"
          cleanup="$RUNNER_TEMP/linux-native-isolation/cgroup-cleanup.json"
          cleanup_state="$RUNNER_TEMP/linux-native-isolation/cgroup-cleanup-state.json"
          rollback="$RUNNER_TEMP/linux-native-isolation/cgroup-rollback.json"
          policy="$RUNNER_TEMP/linux-native-isolation/systemd-policy.json"
          failure="$RUNNER_TEMP/linux-native-isolation/cgroup-failure.json"
          target_journal="$RUNNER_TEMP/linux-native-isolation/target-unit-journal.json"
          control_journal="$RUNNER_TEMP/linux-native-isolation/control-unit-journal.json"
          if test -f "$state" && test -f "$mechanics" && test -f "$policy"; then
            if ! sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
              scripts/manage_linux_native_cgroup.py cleanup-v19 \
              --state "$state" \
              --mechanics "$mechanics" \
              --unit-policy "$policy" \
              --cleanup-state "$cleanup_state" \
              --output "$cleanup" \
              --implementation-commit "$IMPLEMENTATION_COMMIT" \
              --environment-instance-id "$environment_id" \
              --failure-output "$failure"; then
              if test -f "$cleanup_state"; then
                sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
                  scripts/manage_linux_native_cgroup.py resume-v19 \
                  --state "$state" \
                  --mechanics "$mechanics" \
                  --unit-policy "$policy" \
                  --cleanup-state "$cleanup_state" \
                  --output "$rollback" \
                  --implementation-commit "$IMPLEMENTATION_COMMIT" \
                  --environment-instance-id "$environment_id" \
                  --failure-output "$failure"
              else
                sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
                  scripts/manage_linux_native_cgroup.py rollback-v19 \
                  --state "$state" \
                  --target-journal "$target_journal" \
                  --control-journal "$control_journal" \
                  --output "$rollback" \
                  --implementation-commit "$IMPLEMENTATION_COMMIT" \
                  --environment-instance-id "$environment_id" \
                  --failure-output "$failure"
              fi
              exit 1
            fi
          elif test -f "$state"; then
            sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
              scripts/manage_linux_native_cgroup.py rollback-v19 \
              --state "$state" \
              --target-journal "$target_journal" \
              --control-journal "$control_journal" \
              --output "$rollback" \
              --implementation-commit "$IMPLEMENTATION_COMMIT" \
              --environment-instance-id "$environment_id" \
              --failure-output "$failure"
          fi
      - name: Remove owned AppArmor authority and seal cleanup
        if: always()
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          state="$RUNNER_TEMP/linux-native-isolation/apparmor-state.json"
          mechanics="$RUNNER_TEMP/linux-native-isolation/mechanics.json"
          cleanup="$RUNNER_TEMP/linux-native-isolation/apparmor-cleanup.json"
          failure="$RUNNER_TEMP/linux-native-isolation/lifecycle-failure.json"
          if test -f "$state" && test -f "$mechanics"; then
            sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
              scripts/manage_linux_native_isolation_apparmor.py cleanup \
              --state "$state" \
              --mechanics "$mechanics" \
              --output "$cleanup" \
              --implementation-commit "$IMPLEMENTATION_COMMIT" \
              --environment-instance-id "$environment_id" \
              --failure-output "$failure"
          elif test -f "$state"; then
            sudo "$GITHUB_WORKSPACE/.venv/bin/python" \
              scripts/manage_linux_native_isolation_apparmor.py rollback \
              --state "$state" \
              --implementation-commit "$IMPLEMENTATION_COMMIT" \
              --environment-instance-id "$environment_id" \
              --failure-output "$failure"
          fi
      - name: Join mechanics and cleanup authority
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          environment_id="$(cat "$RUNNER_TEMP/linux-native-isolation/environment-id")"
          test ! -e "$RUNNER_TEMP/linux-native-isolation/failure.json"
          test ! -e "$RUNNER_TEMP/linux-native-isolation/lifecycle-failure.json"
          test ! -e "$RUNNER_TEMP/linux-native-isolation/cgroup-failure.json"
          uv run --locked python scripts/finalize_linux_native_isolation.py \
            --mechanics "$RUNNER_TEMP/linux-native-isolation/mechanics.json" \
            --cleanup "$RUNNER_TEMP/linux-native-isolation/apparmor-cleanup.json" \
            --cgroup-cleanup "$RUNNER_TEMP/linux-native-isolation/cgroup-cleanup.json" \
            --output "$RUNNER_TEMP/linux-native-isolation/qualification.json" \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --environment-instance-id "$environment_id" \
            --failure-output "$RUNNER_TEMP/linux-native-isolation/lifecycle-failure.json"
          test ! -e "$RUNNER_TEMP/linux-native-isolation/failure.json"
          test ! -e "$RUNNER_TEMP/linux-native-isolation/lifecycle-failure.json"
          test ! -e "$RUNNER_TEMP/linux-native-isolation/cgroup-failure.json"
          rm "$RUNNER_TEMP/linux-native-isolation/mechanics.json" \
            "$RUNNER_TEMP/linux-native-isolation/apparmor-cleanup.json" \
            "$RUNNER_TEMP/linux-native-isolation/cgroup-cleanup.json" \
            "$RUNNER_TEMP/linux-native-isolation/cgroup-cleanup-state.json" \
            "$RUNNER_TEMP/linux-native-isolation/cgroup-state.json" \
            "$RUNNER_TEMP/linux-native-isolation/control-observation.json" \
            "$RUNNER_TEMP/linux-native-isolation/control-execution.json" \
            "$RUNNER_TEMP/linux-native-isolation/control-receipt.json" \
            "$RUNNER_TEMP/linux-native-isolation/control-unit-journal.json" \
            "$RUNNER_TEMP/linux-native-isolation/target-unit-journal.json" \
            "$RUNNER_TEMP/linux-native-isolation/systemd-policy.json" \
            "$RUNNER_TEMP/linux-native-isolation/environment-id"
      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devfabric-linux-native-isolation-qualification
          path: |
            ${{ runner.temp }}/linux-native-isolation/qualification.json
            ${{ runner.temp }}/linux-native-isolation/failure.json
            ${{ runner.temp }}/linux-native-isolation/lifecycle-failure.json
            ${{ runner.temp }}/linux-native-isolation/cgroup-failure.json
            ${{ runner.temp }}/linux-native-isolation/cgroup-rollback.json
            ${{ runner.temp }}/linux-native-isolation/cgroup-cleanup-state.json
            ${{ runner.temp }}/linux-native-isolation/cgroup-state.json
            ${{ runner.temp }}/linux-native-isolation/cgroup-cleanup.json
            ${{ runner.temp }}/linux-native-isolation/mechanics.json
            ${{ runner.temp }}/linux-native-isolation/control-observation.json
            ${{ runner.temp }}/linux-native-isolation/control-execution.json
            ${{ runner.temp }}/linux-native-isolation/control-receipt.json
            ${{ runner.temp }}/linux-native-isolation/control-unit-journal.json
            ${{ runner.temp }}/linux-native-isolation/target-unit-journal.json
            ${{ runner.temp }}/linux-native-isolation/systemd-policy.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
