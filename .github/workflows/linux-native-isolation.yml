name: Native Linux isolation mechanics

on:
  pull_request:
    paths:
      - '.github/workflows/linux-native-isolation.yml'
      - 'src/devhub/linux_isolation.py'
      - 'src/devhub/linux_ollama_broker.py'
      - 'scripts/linux_native_isolation_child.py'
      - 'scripts/probe_linux_native_isolation.py'
      - 'tests/test_linux_native_isolation.py'
      - 'docs/NATIVE_BUNDLES.md'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-isolation-mechanics:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install exact locked tooling
        run: |
          python -m pip install pip==26.2.1 uv==0.12.10
          uv sync --locked
      - name: Focused Linux isolation contracts
        run: >-
          uv run --locked pytest -q
          tests/test_linux_native_isolation.py
          tests/test_ollama_transport.py
          tests/test_linux_native_bundle.py
      - name: Real rootless namespace and broker mechanics
        env:
          IMPLEMENTATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          environment_id="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          mkdir -p "$RUNNER_TEMP/linux-native-isolation"
          uv run --locked python scripts/probe_linux_native_isolation.py \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --environment-instance-id "$environment_id" \
            --output "$RUNNER_TEMP/linux-native-isolation/receipt.json" \
            --failure-output "$RUNNER_TEMP/linux-native-isolation/failure.json"
      - name: Upload bounded mechanics evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devfabric-linux-native-isolation-mechanics
          path: ${{ runner.temp }}/linux-native-isolation/*.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
