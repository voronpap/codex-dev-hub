name: Native Windows Codex qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-native-qualification.yml'
      - 'benchmarks/stage3g-host-manifest-v2.json'
      - 'docs/evidence/stage3g-production-router/delegate-input-schema.json'
      - 'patches/stage3g-approved-call/**'
      - 'scripts/build_stage3g_build009.py'
      - 'scripts/build_windows_native_codex.py'
      - 'scripts/derive_router_build_lock.py'
      - 'scripts/derive_stage3g_production_lock.py'
      - 'scripts/stage3g_build009_mcp.py'
      - 'scripts/stage3g_schema_hash.py'
      - 'tests/test_windows_native_codex.py'

concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-build-proof:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked Python tooling
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install 1.95.0 --component rustfmt --target x86_64-pc-windows-msvc
          rustup run 1.95.0 rustc -vV
          rustup run 1.95.0 cargo --version --verbose
          rustup run 1.95.0 rustfmt --version
      - name: Cheap Windows build/proof regressions
        run: >-
          uv run --locked pytest -q
          tests/test_windows_native_codex.py
          tests/test_stage3g_build009_preparation.py
          tests/test_host_process_visibility.py
      - name: Build and prove native Windows Codex
        shell: pwsh
        run: |
          $workspace = 'C:\dfw001\s'
          $output = 'C:\dfw001\e'
          uv run --locked python scripts/build_windows_native_codex.py `
            --workspace $workspace `
            --output $output `
            --build-id windows-build-001 `
            --expected-implementation-commit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Upload exact Windows executable and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devfabric-windows-build-001
          path: C:\dfw001\e
          if-no-files-found: error
          retention-days: 14
