name: Pinned production admission candidate (no model)
on:
  push:
    branches-ignore: [main]
    paths:
      - 'patches/stage3g-approved-call/**'
      - 'scripts/assemble_approved_call_patch.py'
      - 'scripts/build_production_router_proof.py'
      - 'scripts/production_router_test.rs'
      - 'scripts/synthetic_approved_mcp.py'
      - '.github/workflows/production-router-proof.yml'
  workflow_dispatch:
concurrency:
  group: production-admission-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pinned-production-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned build prerequisites
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - name: Compile patched pinned source and test without network
        run: python scripts/build_production_router_proof.py --workspace "$RUNNER_TEMP/production-source" --output "$RUNNER_TEMP/production-proof/result.json" --derived-test-build-lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pinned-production-admission-proof
          path: ${{ runner.temp }}/production-proof
          if-no-files-found: error
