name: Native Windows loader qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-native-loader.yml'
      - 'native/windows_loader/**'
      - 'scripts/build_windows_native_loader.py'
      - 'src/devhub/native_bundle.py'
      - 'tests/test_windows_native_loader.py'
      - 'uv.lock'
      - 'pyproject.toml'

concurrency:
  group: native-windows-loader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-native-loader-proof:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install locked tooling
        shell: pwsh
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked
      - name: Download exact embedded CPython authority
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'embedded-python'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3') { throw 'Embedded CPython hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
      - name: Build exact native loader under MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Pinned runner MSVC installation is unavailable' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = 'call "' + $devcmd + '" -arch=amd64 -host_arch=amd64 && uv run --locked python scripts/build_windows_native_loader.py --output "' + (Join-Path $env:RUNNER_TEMP 'native-loader') + '" --runtime-root "' + (Join-Path $env:RUNNER_TEMP 'embedded-python') + '" --expected-commit "${{ github.event.pull_request.head.sha || github.sha }}" --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}"'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Native-loader build failed: $LASTEXITCODE" }
      - name: Relocate and prove fixed loader/import matrix
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'embedded-python'
          $relocated = Join-Path $env:RUNNER_TEMP 'relocated-python'
          Copy-Item -Recurse -LiteralPath $source -Destination $relocated
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'native-loader\_devfabric_native_loader.pyd') -Destination $relocated
          $probe = @'
          import importlib, json, pathlib, sys
          assert '_ctypes' not in sys.modules and '_hashlib' not in sys.modules and '_ssl' not in sys.modules
          loader = importlib.import_module('_devfabric_native_loader')
          origin = pathlib.Path(loader.__file__).resolve()
          assert origin.parent == pathlib.Path(sys.executable).resolve().parent
          assert loader.activate() == ('libffi-8.dll', 'libcrypto-3.dll', 'libssl-3.dll')
          modules = ['_ctypes', '_socket', '_overlapped', 'select', '_hashlib', '_ssl']
          for name in modules:
              module = importlib.import_module(name)
              assert pathlib.Path(module.__file__).resolve().parent == origin.parent
          print(json.dumps({'loader_origin': str(origin), 'modules': modules}, sort_keys=True))
          '@
          $probePath = Join-Path $env:RUNNER_TEMP 'native-loader-probe.py'
          Set-Content -LiteralPath $probePath -Value $probe -Encoding utf8NoBOM
          & (Join-Path $relocated 'python.exe') -I -B $probePath
          if ($LASTEXITCODE -ne 0) { throw "Relocated native-loader proof failed: $LASTEXITCODE" }
      - name: Focused contract tests
        run: uv run --locked pytest -q tests/test_windows_native_loader.py
      - name: Upload exact loader authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devfabric-windows-native-loader
          path: ${{ runner.temp }}\native-loader
          if-no-files-found: error
          retention-days: 14
