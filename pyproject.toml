[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "codex-dev-hub"
version = "0.1.0"
description = "Offline-first MCP toolbox skeleton for Codex development"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flatbuffers==25.12.19",
    "mcp==2.2.0",
    "pydantic==2.12.5",
    "tokenizers==0.22.1",
]

[project.scripts]
devhub = "devhub.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
    "mypy==1.18.2",
    "jsonschema==4.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows_smoke: platform-sensitive Windows contracts (also run on Linux)"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/devhub"]
